server:
  host: "0.0.0.0"
  port: 8080

database:
  url: "postgres://app:secret@localhost:5432/expenses"

telegram:
  token: "YOUR_TELEGRAM_BOT_TOKEN"
  poll_timeout: 60
  proxy_url: ""

llm:
  provider: "openai"
  base_url: "https://api.openai.com/v1"
  api_key: "YOUR_OPENAI_API_KEY"
  model: "gpt-4o-mini"
  temperature: 0.1
  max_tokens: 1024
  timeout: 30s

web:
  port: 3000